name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Official actions/deploy-pages cannot CREATE a Pages site with this
# GitHub App token. Publishing the built PWA to the gh-pages branch
# is what GitHub actually serves at:
#   https://megabomb420.github.io/anime-buddy/
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: SPA fallback for client routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
